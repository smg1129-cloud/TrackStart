name: Deploy TrackStart to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/track-athlete-start-timer-8nwqmh
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Best-effort auto-enable. On many repos the Actions token cannot
          # CREATE the Pages site, so if this fails, enable Pages once under
          # repo Settings -> Pages -> Source: GitHub Actions, then re-run.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # The app is a static site served from the repo root.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
